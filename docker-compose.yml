# Execução local/homologação: docker compose up -d --build
# Variáveis vêm de um arquivo .env na raiz (copie de .env.example; nunca versionado).
name: karol-glow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-karolglow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3008"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-karolglow}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3008}
    ports:
      - "${APP_PORT:-3008}:3008"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

volumes:
  pgdata:
