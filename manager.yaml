# Stack Docker Swarm (Traefik + PostgreSQL compartilhado), no mesmo padrão dos outros projetos.
# Variáveis (defina na stack do Portainer, nunca no arquivo):
#   APP_DOMAIN         domínio principal, ex.: karol-glow.bigspacecreative.com.br
#   APP_DOMAIN_2       domínio extra opcional (ex.: karol-glow.com.br) — atende os dois ao mesmo tempo
#   POSTGRES_PASSWORD  senha do banco (obrigatória)
#   KG_IMAGE           imagem a executar (padrão: karol-glow:latest)
# Pré-requisito: o banco ${POSTGRES_DB} e o usuário ${POSTGRES_USER} já existem no serviço "postgres".
version: "3.7"

services:
  karol-glow:
    image: ${KG_IMAGE:-karol-glow:latest}
    environment:
      NODE_ENV: production
      PORT: "3008"
      DATABASE_URL: postgres://${POSTGRES_USER:-karolglow}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-karolglow}
      # Front e API na mesma origem; o Traefik é o 1 proxy confiável (IP real e cookie Secure)
      CORS_ORIGINS: https://${APP_DOMAIN},https://${APP_DOMAIN_2:-extra.invalid}
      TRUST_PROXY: "1"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.karol-glow.rule=Host(`${APP_DOMAIN}`) || Host(`${APP_DOMAIN_2:-extra.invalid}`)
        - traefik.http.routers.karol-glow.entrypoints=websecure
        - traefik.http.routers.karol-glow.tls.certresolver=letsencryptresolver
        - traefik.http.routers.karol-glow.service=karol-glow
        - traefik.http.services.karol-glow.loadbalancer.server.port=3008

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
